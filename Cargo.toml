[workspace]
resolver = "2"
members = [
    "crates/lora-protocol",
    "crates/lora-core",
    "crates/lora-platform",
    "workers/llama",
    "apps/cli",
    "apps/api",
    "apps/desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false
repository = "https://github.com/hami9/Lora-Agent"

[workspace.dependencies]
lora-protocol = { path = "crates/lora-protocol" }
lora-core = { path = "crates/lora-core" }
lora-platform = { path = "crates/lora-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sysinfo = "0.32"
tempfile = "3.13"

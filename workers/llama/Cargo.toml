[package]
name = "lora-llama-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Isolated inference worker shim speaking length-prefixed v1 JSON over inherited anonymous pipes"

[[bin]]
name = "lora-llama-worker"
path = "src/main.rs"

[features]
default = []
# Link the pinned llama.cpp (vendor/llama.cpp submodule) through the C++ shim in native/
native-llama-cpp = ["dep:sysinfo"]

[dependencies]
lora-protocol.workspace = true
lora-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
sysinfo = { workspace = true, optional = true }

[build-dependencies]
# Only exercised when the `native-llama-cpp` feature is on (see build.rs); both compile in seconds.
cc = "1"
cmake = "0.1"

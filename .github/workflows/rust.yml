name: Rust Workspace

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build worker, CLI, API, and Desktop binaries (locked)
        run: cargo build --workspace --locked
      - name: Run unit, MVP (M1-M8), and post-MVP acceptance suites (locked)
        run: cargo test --workspace --locked
      - name: Run offline GGUF fixture smoke test
        run: |
          cargo run --locked -p lora-cli -- generate-fixture ./ci-smoke.gguf
          cargo run --locked -p lora-cli -- inspect
          cargo run --locked -p lora-cli -- risk-matrix
          cargo run --locked -p lora-cli -- import ./ci-smoke.gguf --alias ci-model
          cargo run --locked -p lora-cli -- plan --model ci-model --context 2048
          cargo run --locked -p lora-cli -- chat --model ci-model --prompt "Smoke test local-first inference"
          cargo run --locked -p lora-api -- --print-openapi
          cargo run --locked -p lora-desktop -- --dump-view-model
          cargo run --locked -p lora-desktop -- --preview-consent "docs/guide.md"

  native-llama:
    name: Native llama.cpp worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Enable long paths (llama.cpp)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build worker with native-llama-cpp
        run: cargo build -p lora-llama-worker --features native-llama-cpp --locked
      - name: Clippy with native-llama-cpp
        run: cargo clippy -p lora-llama-worker --all-targets --features native-llama-cpp --locked -- -D warnings
      - name: Worker unit tests
        run: cargo test -p lora-llama-worker --features native-llama-cpp --locked

name: Documentation

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    name: Validate docs
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and validate documentation
        run: |
          set -euo pipefail
          python3 -B scripts/docs.py package docs-v0.0.0 --output "$RUNNER_TEMP/docs"
          (cd "$RUNNER_TEMP/docs" && sha256sum --check SHA256SUMS)
      - name: Upload verified bundle
        if: github.event_name == 'push' && (github.ref_type == 'branch' || github.event.created)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: ${{ runner.temp }}/docs/
          if-no-files-found: error
          retention-days: 3
